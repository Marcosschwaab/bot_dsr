name: Deploy bot_dsr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /var/www/bot_dsr

            git fetch origin
            git reset --hard origin/main

            npm ci --omit=dev

            pm2 restart bot-dsr
            pm2 save